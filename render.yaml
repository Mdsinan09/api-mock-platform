services:
  - type: web
    name: api-mock-platform
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: apimock
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
